<ul>
    @for (member of team(); track $index) {
        <li>
            <app-team-member
                [firstName]="member.firstName"
                [lastName]="member.lastName"
                [profession]="member.profession"
                [imageUrl]="member.picture"
                [motive]="member.motive"
                [role]="member.role"
                [secondaryImageUrl]="member.secondaryPicture"
            ></app-team-member>
        </li>
    }
</ul>
