<div class="wrapper">
    <div class="main">
        @for (image of images(); track $index) {
            <img [alt]="image.imageAlt" [src]="image.imageUrl" [class]="currentIndex() === $index ? 'active' : null" loading="lazy" />
        }
    </div>

    <button type="button" class="next" (click)="nextImage()"></button>
    <button type="button" class="previous" (click)="previousImage()"></button>

    <div class="ruler">
        @for (image of images(); track $index) {
            <img
                [alt]="image.imageAlt"
                [src]="image.imageUrl.includes('blob:') ? image.imageUrl : image.imageUrl.includes('?') ? image.imageUrl + '&width=250&height=250&fit=cover' : image.imageUrl + '?width=250&height=250&fit=cover'"
                (click)="setImage($index)"
                [class]="currentIndex() === $index ? 'active' : null"
                loading="lazy"
            />
        }
    </div>
</div>
