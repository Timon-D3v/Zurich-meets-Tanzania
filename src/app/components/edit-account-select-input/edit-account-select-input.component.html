<label [for]="inputId">{{ label() }}</label>
<div>
    <img [src]="iconSource()" [alt]="iconAlt()" />
    <select [id]="inputId" [title]="label()" [attr.required]="required() ? true : null" [attr.disabled]="disabled() ? true : null" (input)="streamValue($event)">
        @for (option of options(); track $index) {
            <option [value]="option.value" [selected]="option.selected" [attr.disabled]="option.disabled ? true : null">{{ option.label }}</option>
        }
    </select>
</div>
